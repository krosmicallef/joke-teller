spring:
  application:
    name: joke-teller

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: user
    password: password

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

openai:
  api-key: ADD_KEY

logging:
  level:
    com.christophermicallef: DEBUG

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:vN8qL2xR5mT9pK3wY7cF1aH6dS4jB0zG}
    lifetime-seconds: ${ADMIN_JWT_LIFETIME_SECONDS:1800}
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:password123}
