spring:
  application:
    name: joke-teller-sender

sender:
  schedule:
    # Spring cron format: second minute hour day-of-month month day-of-week.
    # Runs daily at midnight by default.
    cron: "0 * * * * *"

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: user
    password: password

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

openai:
  api-key: ADD_KEY

logging:
  level:
    com.christophermicallef: DEBUG
